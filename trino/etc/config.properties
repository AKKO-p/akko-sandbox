# A single Trino node: coordinator and worker at once.
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080

# Users reach Trino over https only. Plain http stays open inside the
# container for the health check, which reads the public /v1/info.
http-server.http.port=8080
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/certs/trino.pem

# Every request carries a Keycloak token, which Trino verifies itself:
# signature against the realm's JWKS, issuer, audience. The user is the
# token's preferred_username, the same claim akko-mcp-trino names in its audit.
http-server.authentication.type=JWT
http-server.authentication.jwt.key-file=http://keycloak:8080/realms/sandbox/protocol/openid-connect/certs
http-server.authentication.jwt.principal-field=preferred_username
http-server.authentication.jwt.required-issuer=${ENV:OIDC_ISSUER}
http-server.authentication.jwt.required-audience=trino

# Required once authentication is on. One node, so it never leaves the container.
internal-communication.shared-secret=akko-sandbox-demo-only-shared-secret

# Sized for a laptop.
query.max-memory=256MB
query.max-memory-per-node=256MB
