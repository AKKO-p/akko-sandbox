name: demo-recording

# Records docs/demo.gif and docs/demo.mp4 from docs/demo.tape, on demand.
# Download the artifact, look at it, then commit docs/demo.gif by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: akko-sandbox-demo
    steps:
      - uses: actions/checkout@v7

      - name: Pull the images
        run: docker compose --profile tools pull --quiet

      - name: Start the sandbox
        run: docker compose up -d --wait --wait-timeout 420

      - name: Record the demo
        uses: charmbracelet/vhs-action@v2
        with:
          version: v0.12.1
          path: docs/demo.tape
          install-fonts: true

      - name: Sizes
        run: ls -lh docs/demo.gif docs/demo.mp4

      - uses: actions/upload-artifact@v7
        with:
          name: demo
          path: |
            docs/demo.gif
            docs/demo.mp4
          if-no-files-found: error

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Remove everything
        if: always()
        run: docker compose --profile tools down -v --remove-orphans
