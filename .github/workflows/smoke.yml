name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The READMEs hold no leftover of a substitution template ({NN}, {NB}).
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7

      - name: No template leftover in the Markdown files
        run: "! grep -rnE '[{](NN|NB)[}]' --include='*.md' ."

  # The real-agent harness's unit tests: no model, no server, no key.
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          pip install --quiet -r requirements.txt
          python -m pytest -q -p no:cacheprovider tests

  # The bench's own tests and the schema of every committed result: no Docker, no model.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: The bench's tests
        run: |
          pip install --quiet -r bench/requirements.txt
          python -m pytest -q -p no:cacheprovider bench/tests

      - name: Every committed result matches the schema
        run: find bench/results -name '*.json' -print0 | xargs -0 -r python bench/lib/record.py validate

  smoke:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          # arm64: GitHub's arm runners are free for public repositories only.
          # Enable this line the day the repository goes public.
          # - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: akko-sandbox-ci
    steps:
      - uses: actions/checkout@v7

      - name: Pull the images
        run: docker compose --profile tools pull --quiet --ignore-pull-failures

      - name: Start, play the demo, check everything
        run: KEEP=1 tests/smoke.sh

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Remove everything
        if: always()
        run: docker compose --profile tools down -v --remove-orphans

      - name: Behind Trino Gateway, check everything
        env:
          COMPOSE_FILE: compose.yaml:gateway/compose.gateway.yaml
        run: |
          docker compose --profile tools pull --quiet --ignore-pull-failures
          KEEP=1 tests/gateway.sh

      - name: Service logs, behind Trino Gateway
        if: failure()
        env:
          COMPOSE_FILE: compose.yaml:gateway/compose.gateway.yaml
        run: docker compose logs --no-color

      - name: Remove everything, behind Trino Gateway
        if: always()
        env:
          COMPOSE_FILE: compose.yaml:gateway/compose.gateway.yaml
        run: docker compose --profile tools down -v --remove-orphans

      - name: The tools of akko-mcp-trino 0.7, check everything
        env:
          COMPOSE_PROJECT_NAME: akko-sandbox-v07
        run: KEEP=1 tests/v07.sh

      - name: Service logs, the tools of 0.7
        if: failure()
        env:
          COMPOSE_PROJECT_NAME: akko-sandbox-v07
          COMPOSE_FILE: compose.yaml:tests/compose.v07.yaml
        run: docker compose logs --no-color

      - name: Remove everything, the tools of 0.7
        if: always()
        env:
          COMPOSE_PROJECT_NAME: akko-sandbox-v07
          COMPOSE_FILE: compose.yaml:tests/compose.v07.yaml
        run: docker compose --profile tools down -v --remove-orphans

      - name: The read allow-list of akko-mcp-trino 0.7.1 and later, check everything
        env:
          COMPOSE_PROJECT_NAME: akko-sandbox-v071
        run: KEEP=1 tests/v071.sh

      - name: Service logs, the read allow-list
        if: failure()
        env:
          COMPOSE_PROJECT_NAME: akko-sandbox-v071
          COMPOSE_FILE: compose.yaml:tests/compose.v071.yaml
        run: docker compose logs --no-color

      - name: Remove everything, the read allow-list
        if: always()
        env:
          COMPOSE_PROJECT_NAME: akko-sandbox-v071
          COMPOSE_FILE: compose.yaml:tests/compose.v071.yaml
        run: docker compose --profile tools down -v --remove-orphans
