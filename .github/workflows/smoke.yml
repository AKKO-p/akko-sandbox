name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          # arm64: GitHub's arm runners are free for public repositories only.
          # Enable this line the day the repository goes public.
          # - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: akko-sandbox-ci
    steps:
      - uses: actions/checkout@v7

      - name: Pull the images
        run: docker compose --profile tools pull --quiet

      - name: Start, play the demo, check everything
        run: KEEP=1 tests/smoke.sh

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Remove everything
        if: always()
        run: docker compose --profile tools down -v --remove-orphans
