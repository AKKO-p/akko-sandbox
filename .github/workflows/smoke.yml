name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          # arm64: GitHub's arm runners are free for public repositories only.
          # Enable this line the day the repository goes public.
          # - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: akko-sandbox-ci
    steps:
      - uses: actions/checkout@v7

      - name: Build akko-mcp-trino from source, until 0.6.0 is published
        if: env.MCP_CORE_REF != ''
        run: |
          git clone --quiet --depth 1 --branch "$MCP_CORE_REF" https://github.com/AKKO-p/akko-mcp-trino.git core
          sed -i 's/^version = "0.6.0"/version = "0.6.0rc1"/' core/pyproject.toml
          sed -i 's/__version__ = "0.6.0"/__version__ = "0.6.0rc1"/' core/akko_mcp_trino/__init__.py
          docker build --quiet --tag "$MCP_IMAGE" core
          docker run --rm "$MCP_IMAGE" akko-mcp-trino --version

      - name: Pull the images
        run: docker compose --profile tools pull --quiet --ignore-pull-failures

      - name: Start, play the demo, check everything
        run: KEEP=1 tests/smoke.sh

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Remove everything
        if: always()
        run: docker compose --profile tools down -v --remove-orphans

      - name: Behind Trino Gateway, check everything
        env:
          COMPOSE_FILE: compose.yaml:gateway/compose.gateway.yaml
        run: |
          docker compose --profile tools pull --quiet --ignore-pull-failures
          KEEP=1 tests/gateway.sh

      - name: Service logs, behind Trino Gateway
        if: failure()
        env:
          COMPOSE_FILE: compose.yaml:gateway/compose.gateway.yaml
        run: docker compose logs --no-color

      - name: Remove everything, behind Trino Gateway
        if: always()
        env:
          COMPOSE_FILE: compose.yaml:gateway/compose.gateway.yaml
        run: docker compose --profile tools down -v --remove-orphans
