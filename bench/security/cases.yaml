# The security axis: the suites bench/run.sh plays, and a stable id for every check
# their scripts print. tests/*.sh stay the source of the checks; this file only
# names them. A check is matched by its name with its numbers folded (a count the
# server says, an address), and by its rank among checks of the same name (nth).
#
# A check a script prints that is not named here fails the run, under the suite's
# `unlisted` id: name it in the same commit, with
#   python3 bench/lib/record.py cases-add <suite> bench/evidence/<run>/<suite>.log
# A case named here that the script did not print is not_run.
#
# visibility: private keeps a case's name and detail out of bench/results (only its
# id and verdict stay). No case is private today. Some reads, such as SHOW STATS or
# EXPLAIN, can show facts beyond a row filter or a column mask; refused by default.
# unnamed_private: a check the suite prints and this file does not name yet stays out
# of the public result too, until someone names it here.

suites:
  smoke:
    script: smoke
    script_path: tests/smoke.sh
    compose_file: compose.yaml
    family: SEC-SMK
    run_case: SEC-SMK-000
    unlisted: SEC-SMK-UNNAMED
  gateway:
    script: gateway
    script_path: tests/gateway.sh
    compose_file: compose.yaml:gateway/compose.gateway.yaml
    family: SEC-GW
    run_case: SEC-GW-000
    unlisted: SEC-GW-UNNAMED
  v07:
    script: v07
    script_path: tests/v07.sh
    compose_file: compose.yaml:tests/compose.v07.yaml
    family: SEC-V07
    run_case: SEC-V07-000
    unlisted: SEC-V07-UNNAMED
  v07-gateway:
    script: v07
    variant: gateway
    script_path: tests/v07.sh
    compose_file: compose.yaml:gateway/compose.gateway.yaml:tests/compose.v07.yaml:tests/compose.v07.gateway.yaml
    env: {GATEWAY: "1"}
    family: SEC-V07
    run_case: SEC-V07-000
    unlisted: SEC-V07-UNNAMED
  v071:
    script: v071
    script_path: tests/v071.sh
    compose_file: compose.yaml:tests/compose.v071.yaml
    family: SEC-R
    run_case: SEC-R-000
    unlisted: SEC-R-UNNAMED
    unnamed_private: true
  v071-gateway:
    script: v071
    variant: gateway
    script_path: tests/v071.sh
    compose_file: compose.yaml:gateway/compose.gateway.yaml:tests/compose.v071.yaml
    env: {GATEWAY: "1"}
    family: SEC-R
    run_case: SEC-R-000
    unlisted: SEC-R-UNNAMED
    unnamed_private: true
  leaks:
    script: leaks
    script_path: bench/security/leaks.sh
    compose_file: compose.yaml:tests/compose.v07.yaml
    family: SEC-LK
    run_case: SEC-LK-000
    unlisted: SEC-LK-UNNAMED

